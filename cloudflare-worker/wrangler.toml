name = "f1-yoto-myo-worker"
main = "worker.js"
compatibility_date = "2024-01-01"

# KV namespace binding for storing F1 data
[[kv_namespaces]]
binding = "F1_DATA"
id = "d3e9ce1a8db6447a80cde6e0be1df9f6"

# Refresh every 15 minutes. Each run makes ~8 OpenF1 calls (meetings, sessions,
# weather, driver grid, and the standings lookups), well within the Community-tier
# limit of 3 req/s / 30 req/min even run back-to-back. The KV payload is written on
# every run (~96 writes/day), which stays far under Cloudflare's free-tier KV write quota.
[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

# Routes configuration (update with your custom domain)
# routes = [
#   { pattern = "your-domain.workers.dev/*", zone_name = "your-domain.workers.dev" }
# ]
