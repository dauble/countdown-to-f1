# fly.toml app configuration file generated for countdown-to-f1 on 2026-09-04T01:24:06Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'countdown-to-f1'
primary_region = 'iad'

[build]

[[mounts]]
  source = 'yoto_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
